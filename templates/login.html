{% extends "layout.html" %}
{% block title %}Log In{% endblock %}
{% block main %}
<div class="auth-wrap">
  <section class="card auth-card rise d1">
    <div class="auth-head">
      <span class="brand-mark" aria-hidden="true">
        <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/></svg>
      </span>
      <h1>Welcome back</h1>
      <p>Log in to check on your portfolio.</p>
    </div>
    <form action="/login" method="post">
      <div class="field">
        <label for="username">Username</label>
        <input class="input" id="username" autocomplete="off" autofocus name="username" type="text" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input class="input" id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <p class="auth-alt">New here? <a href="/register">Create an account</a> — it comes with $10,000 in virtual cash.</p>
  </section>
</div>
{% endblock %}
