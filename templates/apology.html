{% extends "layout.html" %}
{% block title %}Apology{% endblock %}
{% block main %}
<section class="card apology-card rise d1">
  <h1>Sorry — that didn't work</h1>
  <p>{{ bottom }}</p>
  <!-- https://memegen.link/ -->
  <img alt="{{ top }}" src="https://api.memegen.link/images/custom/{{ top | urlencode }}/{{ bottom | urlencode }}.jpg?background=https://i.imgur.com/CsCgN7Ll.png&width=400" title="{{ top }}">
  <div class="quote-actions" style="margin-top: 20px;">
    <a class="btn btn-primary" href="/">Back to portfolio</a>
    <a class="btn btn-ghost" href="/quote">Get a quote</a>
  </div>
</section>
{% endblock %}
